plugin:
  name: custom-data-type-location
  url: https://github.com/programmfabrik/easydb-custom-data-type-location
  displayname:
    en-US: "Custom Data Type: Location"
    de-DE: "Custom Data Type: Location"
  info:
    de-DE: |
      Ein Feldtyp zum Speichern geografischer Koordinaten. Hinterlegen Sie GPS-Koordinaten an einem Datensatz, und das Plugin zeigt den Standort in der Detailansicht des Datensatzes auf einer Karte an.
    en-US: |
      A custom data type for storing geographic coordinates. Enter GPS coordinates on a record and the plugin displays the location on a map in the record's detail view.
  version: 1.0
  server:
    api-version:
      require: 1
  webfrontend:
    url: custom-data-type-location.js
    css: custom-data-type-location.css
    l10n: l10n/

custom_types:
  location:
    update:
      script: build/scripts/location-update.js
      batch_size: 1000
    mapping:
      displayName:
        type: text_l10n
    config:
      schema:
        - name: type
          parameters:
            value:
              type: select
              options: ["latitude_and_longitude"]
